<!DOCTYPE html>
<html>
<head>
    <title>Cricket Registration Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
        }

        h1 {
            color: darkgreen;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 90%;
            padding: 8px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 8px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="reset"] {
            padding: 10px 20px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }

        input[type="reset"]:hover {
            background-color: darkred;
        }

        hr {
            border: 1px solid gray;
        }
    </style>
</head>
<body>

    <h1 align="center">Cricket Registration Form</h1>
    <hr>
    <div class="container">
        <form>

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Age:</label><br>
        <input type="number" placeholder="Enter your age"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" placeholder="Enter your mobile number"><br><br>

        <label>Select Your Role:</label><br>
        <select>
            <option>Batsman</option>
            <option>Bowler</option>
            <option>All-Rounder</option>
            <option>Wicket Keeper</option>
        </select>
        <br><br>

        <label>Address:</label><br>
        <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <label>Select Coaching Batch:</label><br>
        <input type="checkbox"> Morning
        <input type="checkbox"> Evening
        <br><br>

        <label>Date of Registration:</label><br>
        <input type="date"><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

    </div>
    <hr>

    <p align="center">
        <b>Thank You for Registering!</b>
    </p>

</body>
</html>
